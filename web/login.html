<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar a Heimdall</title>
<link rel="icon" href="/icon.svg">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#16171a">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="centrado">
<main class="tarjeta">
  <button id="tema" class="fantasma suelto" title="cambiar el tema">☾</button>
  <h1>Heimdall</h1>
  <p class="tenue">Escribí tu mail y te mando un link para entrar.</p>
  <form id="form">
    <label for="email">Mail</label>
    <input id="email" type="email" autocomplete="email" autofocus required>
    <button>Mandarme el link</button>
  </form>
  <p id="aviso" class="aviso"></p>
</main>
<script src="/login.js"></script>
</body>
</html>
