<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimdall</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Heimdall</h1>
  <span id="quien" class="tenue"></span>
  <button id="salir" class="fantasma">Salir</button>
</header>

<main id="app">
  <nav id="entornos" aria-label="Proyectos y entornos"></nav>

  <section id="panel">
    <p id="vacio" class="tenue">Elegí un entorno.</p>

    <form id="primer" hidden>
      <p class="tenue">Todavía no hay nada. El proyecto y el entorno se crean con el primer secreto: minúsculas, números, guiones.</p>
      <div class="linea">
        <input id="primer-project" placeholder="proyecto" autocomplete="off" spellcheck="false" required>
        <input id="primer-env" placeholder="entorno, por ejemplo dev" autocomplete="off" spellcheck="false" required>
      </div>
      <div class="linea">
        <input id="primer-clave" placeholder="CLAVE" autocomplete="off" spellcheck="false" required>
        <input id="primer-valor" placeholder="valor" autocomplete="off" spellcheck="false" required>
      </div>
      <p class="acciones"><button>Crear y guardar</button></p>
    </form>

    <div id="contenido" hidden>
      <h2 id="titulo"></h2>

      <table>
        <thead><tr><th>Clave</th><th>Valor</th><th></th></tr></thead>
        <tbody id="filas"></tbody>
      </table>

      <form id="alta" class="linea">
        <input id="clave" placeholder="CLAVE" autocomplete="off" spellcheck="false" required>
        <input id="valor" placeholder="valor" autocomplete="off" spellcheck="false" required>
        <button>Guardar</button>
      </form>

      <p class="acciones">
        <button id="env" class="fantasma">Copiar como .env</button>
        <button id="refrescar" class="fantasma">Refrescar</button>
      </p>

      <h3>Tokens</h3>
      <div id="tokens"></div>
      <form id="token-nuevo" class="linea">
        <input id="token-nombre" placeholder="nombre" autocomplete="off" required>
        <input id="token-claves" placeholder="claves, separadas por coma (opcional)" autocomplete="off">
        <input id="token-ttl" placeholder="vence, por ejemplo 2h (opcional)" autocomplete="off">
        <button>Crear token</button>
      </form>

      <h3>Auditoría</h3>
      <div id="auditoria"></div>
    </div>
  </section>
</main>

<p id="aviso" class="aviso flotante" hidden></p>
<script src="/util.js"></script>
<script src="/app.js"></script>
</body>
</html>
