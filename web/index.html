<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimdall</title>
<link rel="icon" href="/icon.svg">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#16171a">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Heimdall</h1>
  <span id="quien" class="tenue"></span>
  <button id="tema" class="fantasma" title="cambiar el tema">☾</button>
  <button id="salir" class="fantasma">Salir</button>
</header>

<main id="app">
  <nav id="lateral" aria-label="Proyectos y entornos">
    <button id="nuevo-proyecto" class="fantasma">+ proyecto</button>
    <div id="proyectos"></div>
  </nav>

  <section id="panel">
    <p id="vacio" class="tenue">Elegí un entorno.</p>

    <div id="contenido" hidden>
      <div class="encabezado">
        <h2 id="titulo"></h2>
        <div class="acciones">
          <button id="renombrar-entorno" class="fantasma">renombrar</button>
          <button id="borrar-entorno" class="fantasma peligro">borrar</button>
        </div>
      </div>

      <section class="bloque">
        <div class="bloque-titulo">
          <h3>Claves</h3>
          <span id="cuenta-secretos" class="pildora"></span>
          <span class="empuje"></span>
          <button id="importar" class="fantasma">pegar .env</button>
          <button id="env" class="fantasma">copiar .env</button>
          <button id="refrescar" class="fantasma">refrescar</button>
        </div>
        <table><tbody id="filas"></tbody></table>
        <form id="alta" class="linea">
          <input id="clave" placeholder="CLAVE" autocomplete="off" spellcheck="false" required>
          <input id="valor" placeholder="valor" autocomplete="off" spellcheck="false" required>
          <button>Guardar</button>
        </form>
      </section>

      <section class="bloque">
        <div class="bloque-titulo">
          <h3>Tokens</h3>
          <span id="cuenta-tokens" class="pildora"></span>
          <span class="empuje"></span>
          <button id="mostrar-token" class="fantasma">+ token</button>
        </div>
        <div id="tokens"></div>
        <form id="token-nuevo" class="linea" hidden>
          <input id="token-nombre" placeholder="nombre" autocomplete="off" required>
          <input id="token-claves" placeholder="claves, separadas por coma (opcional)" autocomplete="off">
          <input id="token-ttl" placeholder="vence, por ejemplo 2h (opcional)" autocomplete="off">
          <button>Crear token</button>
        </form>
      </section>

      <section class="bloque">
        <div class="bloque-titulo">
          <h3>Auditoría</h3>
          <span class="empuje"></span>
          <label class="filtro tenue">
            <input type="checkbox" id="incluir-lecturas">
            incluir lecturas
          </label>
          <label class="filtro tenue">
            <input type="checkbox" id="solo-entorno">
            sólo este entorno
          </label>
        </div>
        <div id="auditoria"></div>
      </section>
    </div>
  </section>
</main>

<dialog id="confirmar">
  <p id="confirmar-texto"></p>
  <label id="confirmar-etiqueta" for="confirmar-nombre">Escribí el nombre del proyecto para confirmar</label>
  <input id="confirmar-nombre" autocomplete="off" spellcheck="false">
  <menu>
    <button type="button" id="confirmar-no" class="fantasma">Cancelar</button>
    <button type="button" id="confirmar-si" class="peligro">Borrar</button>
  </menu>
</dialog>

<dialog id="pegar">
  <p>Pegá un .env: una <code>CLAVE=valor</code> por línea. Lo que ya exista se pisa.</p>
  <textarea id="pegar-texto" rows="12" spellcheck="false" autocomplete="off" placeholder="CLAVE=valor"></textarea>
  <menu>
    <button type="button" id="pegar-no" class="fantasma">Cancelar</button>
    <button type="button" id="pegar-si">Importar</button>
  </menu>
</dialog>

<p id="aviso" class="aviso flotante" hidden></p>
<script src="/util.js"></script>
<script src="/app.js"></script>
</body>
</html>
